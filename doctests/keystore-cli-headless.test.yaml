name: "Managing Accounts Headlessly with keystore_cli"
output: keystore-cli-headless.md
release: ""

intro: |
  Every mutation of `keystore_module` — creating, importing, deriving, renaming, exporting
  and deleting accounts — is admitted only to a configured **custodian**. In Basecamp that
  is `keystore_ui`. On a headless `logosctl` daemon there is no such surface, and
  `logosctl call keystore_module import_private_key …` is refused, deliberately: the CLI is
  the host anchor, not a named module.

  `keystore_cli` holds the custodian role for that world. It relays every one of the
  keystore's seventeen gated methods under its own identity — same names, same parameters —
  and turns the keystore's one opaque refusal into a sentence that names the fix. This
  doc-test walks the whole surface against a real daemon, refusals first.

what_you_learn:
  - Why the CLI cannot mutate the keystore on its own, and how a named module can
  - How to name `keystore_cli` a custodian without stripping `keystore_ui`
  - How to pass a JSON document and a password to a relayed method without either being mistyped
  - The full account lifecycle: mnemonic, import, label, HD derivation, export, delete, round-trip
  - Which refusals are the keystore's own rules speaking, and which are the gate

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

sections:
  - title: "Build logosctl and the modules"
    step: true
    text: |
      Two modules take part: `keystore_module` and the `keystore_cli` under test. Both are
      dropped straight into the session's `modules/` directory, next to the bundled
      `capability_module` that handles the load-time handshake.
    steps:
      - title: "Build the CLI"
        run: 'nix build "github:logos-co/logos-logoscore-cli{release}#ctl" --out-link ./logos'
        code_block: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos"
        check_file: "logos/bin/logosctl"
      - title: "Build keystore_module"
        run: 'nix build "github:logos-co/logos-evm-keystore-module#install" --out-link ./result-keystore'
        code_block: "nix build 'github:logos-co/logos-evm-keystore-module#install' --out-link ./result-keystore"
        check_file: "result-keystore/modules/keystore_module/manifest.json"
      - title: "Build keystore_cli"
        run: 'nix build "github:logos-co/logos-keystore-cli{release}#install" --out-link ./result-kcli'
        code_block: |
          # From inside the clone this is simply: nix build '.#install'
          nix build 'github:logos-co/logos-keystore-cli#install' --out-link ./result-kcli
        check_file: "result-kcli/modules/keystore_cli/manifest.json"
      - title: "Lay out the session"
        run: |
          mkdir -p session/modules
          cp -RL ./logos/modules/. ./session/modules/
          for r in result-keystore result-kcli; do cp -RL ./$r/modules/. ./session/modules/; done
          chmod -R u+w session/modules
          ls session/modules
        code_block: |
          mkdir -p session/modules
          cp -RL ./logos/modules/. ./session/modules/
          cp -RL ./result-*/modules/. ./session/modules/
        expect_contains:
          - "keystore_module"
          - "keystore_cli"

  - title: "Start the daemon and load both"
    step: true
    steps:
      - title: "Start the daemon"
        run: "./logos/bin/logosctl --config-dir ./session daemon start --detach"
        code_block: "logosctl daemon start --detach"
      - run: "sleep 3"
      - title: "Load keystore_module"
        run: "./logos/bin/logosctl --config-dir ./session module load keystore_module"
        code_block: "logosctl module load keystore_module"
        expect_contains:
          - "keystore_module"
      - title: "Load keystore_cli"
        run: "./logos/bin/logosctl --config-dir ./session module load keystore_cli"
        code_block: "logosctl module load keystore_cli"
        expect_contains:
          - "keystore_cli"
      - run: "sleep 2"

  - title: "What is refused, and why"
    step: true
    text: |
      Two different refusals. The CLI is refused by the keystore's gate with its deliberately
      opaque `not authorized`. `keystore_cli` is refused by the **same** gate until it is
      named — it holds no special standing, only a name — but it can tell the operator what
      to do about it, because it knows who it is.
    steps:
      - title: "The CLI cannot create a mnemonic"
        run: "./logos/bin/logosctl --config-dir ./session call keystore_module create_mnemonic 12 --human || true"
        code_block: "logosctl call keystore_module create_mnemonic 12"
        expect_contains:
          - "not authorized"
      - title: "Neither can keystore_cli, yet"
        run: "./logos/bin/logosctl --config-dir ./session call keystore_cli create_mnemonic 12 --human || true"
        code_block: "logosctl call keystore_cli create_mnemonic 12"
        expect_contains:
          - "not a configured custodian"
          - "logosctl call keystore_module configure"
      - title: "status says the same"
        run: "./logos/bin/logosctl --config-dir ./session call keystore_cli status --human"
        code_block: "logosctl call keystore_cli status"
        expect_contains:
          - '"held":false'

  - title: "Name the custodian"
    step: true
    text: |
      `configure` is **total**: a document that does not name a role leaves it held by
      nobody. So both roles are stated, and `keystore_ui` stays alongside `keystore_cli`.
    steps:
      - title: "Configure both roles in one call"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_module configure '{"approvers":["signer_ui"],"custodians":["keystore_ui","keystore_cli"]}' --human
        code_block: |
          logosctl call keystore_module configure '{"approvers":["signer_ui"],"custodians":["keystore_ui","keystore_cli"]}'
        expect_contains:
          - '"keystore_cli"'
      - title: "keystore_cli now holds the role"
        run: "./logos/bin/logosctl --config-dir ./session call keystore_cli status --human"
        code_block: "logosctl call keystore_cli status"
        expect_contains:
          - '"held":true'
          - '"identity":"keystore_cli"'
      - title: "Every gated method is on its surface"
        run: |
          ./logos/bin/logosctl --config-dir ./session module show keystore_cli --json > show.json
          python3 -c '
          import json; names = json.dumps(json.load(open("show.json")))
          want = ["create_mnemonic","import_mnemonic","import_private_key","import_keystore_json","export_keystore_json","change_password","set_label","set_group_label","delete_account","derive_next_account","derive_account_at","preview_addresses","create_unrelated_account","forget_derivation","remove_group","settle","remove_unexplained"]
          missing = [m for m in want if m not in names]
          print("MISSING:", missing) if missing else print("ALL_17_PRESENT")'
        code_block: "logosctl module show keystore_cli"
        expect_contains:
          - "ALL_17_PRESENT"

  - title: "Keys in"
    step: true
    text: |
      Two things about arguments. A JSON document is passed as one quoted string (or
      `@file`), never with `json:` — the keystore takes it as text and parses it itself. A
      password is passed with `@file` so it stays out of shell history and `ps`; the file
      may end in a newline, `keystore_cli` strips exactly one.
    steps:
      - title: "Generate a mnemonic"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli create_mnemonic 12 --human \
            | python3 -c 'import sys,json; p=json.load(sys.stdin)["phrase"]; open("phrase.txt","w").write(p); print(len(p.split()), "words")'
        code_block: "logosctl call keystore_cli create_mnemonic 12"
        expect_contains:
          - "12 words"
      - title: "Import a private key"
        text: |
          Foundry's well-known account 0, a published test key. The password file is written
          with `echo`, newline and all.
        run: |
          echo pw > pw.txt
          ./logos/bin/logosctl --config-dir ./session call keystore_cli import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 @pw.txt --human
        code_block: "logosctl call keystore_cli import_private_key <privkey> @pw.txt"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "Name it"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli set_label f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 str:Treasury @pw.txt --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli get_labels --human
        code_block: |
          logosctl call keystore_cli set_label f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 str:Treasury @pw.txt
          logosctl call keystore_cli get_labels
        expect_contains:
          - "Treasury"
      - title: "Import the mnemonic as a derivable wallet"
        text: |
          `storage: "extkey"` keeps the wallet's account key under its own password, so
          later accounts can be derived without the phrase.
        run: |
          python3 -c 'import json; json.dump({"phrase": open("phrase.txt").read(), "password": "pw", "storage": "extkey", "groupPassword": "gp", "groupLabel": "Cold storage"}, open("import.json","w"))'
          ./logos/bin/logosctl --config-dir ./session call keystore_cli import_mnemonic @import.json --human \
            | python3 -c 'import sys,json; v=json.load(sys.stdin); print(v); open("group.txt","w").write(v["group"]); open("a0.txt","w").write(v["address"])'
        code_block: "logosctl call keystore_cli import_mnemonic @import.json"
        expect_contains:
          - "'origin'"
          - "'group'"
      - title: "Derive the next account"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli derive_next_account "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"password\":\"pw\"}" --human
        code_block: |
          logosctl call keystore_cli derive_next_account '{"group":"<group>","groupPassword":"gp","password":"pw"}'
        expect_contains:
          - '"index":1'
      - title: "Preview, then derive at a chosen index"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli preview_addresses "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"count\":3}" --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli derive_account_at "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"password\":\"pw\",\"index\":5}" --human
        code_block: |
          logosctl call keystore_cli preview_addresses '{"group":"<group>","groupPassword":"gp","count":3}'
          logosctl call keystore_cli derive_account_at '{"group":"<group>","groupPassword":"gp","password":"pw","index":5}'
        expect_contains:
          - '"addresses":['
          - '"index":5'
      - title: "Name the wallet"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli set_group_label "{\"group\":\"$(cat group.txt)\",\"label\":\"Vault\",\"address\":\"$(cat a0.txt)\",\"password\":\"pw\"}" --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli get_group_labels --human
        code_block: |
          logosctl call keystore_cli set_group_label '{"group":"<group>","label":"Vault","address":"<address>","password":"pw"}'
          logosctl call keystore_cli get_group_labels
        expect_contains:
          - "Vault"
      - title: "The reads, ungated as ever"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli list_accounts --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli list_groups --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli list_derivation_keys --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli get_provenance --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli caller_identity --human
        code_block: |
          logosctl call keystore_cli list_accounts
          logosctl call keystore_cli caller_identity
        expect_contains:
          - '"accounts":['
          - '"identity":"keystore_cli"'

  - title: "Keys out, and back"
    step: true
    steps:
      - title: "Change the password, export the vault, delete the account"
        run: |
          echo pw2 > pw2.txt
          ./logos/bin/logosctl --config-dir ./session call keystore_cli change_password f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw.txt @pw2.txt --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli export_keystore_json f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw2.txt --human \
            | python3 -c 'import sys,json; open("vault.json","w").write(json.load(sys.stdin)["keystore"]); print("exported")'
          ./logos/bin/logosctl --config-dir ./session call keystore_cli delete_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw2.txt --human
        code_block: |
          logosctl call keystore_cli change_password <address> @pw.txt @pw2.txt
          logosctl call keystore_cli export_keystore_json <address> @pw2.txt
          logosctl call keystore_cli delete_account <address> @pw2.txt
        expect_contains:
          - "exported"
          - '{"ok":true}'
      - title: "A wrong password on delete says so"
        text: |
          The keystore answers a bare `false` here, by construction indistinguishable from a
          refusal. `keystore_cli` checks its own standing and says which it was.
        run: "./logos/bin/logosctl --config-dir ./session call keystore_cli delete_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw.txt --human || true"
        code_block: "logosctl call keystore_cli delete_account <address> @pw.txt"
        expect_contains:
          - "wrong password, or no such account"
      - title: "Import the exported vault under a new password"
        run: "./logos/bin/logosctl --config-dir ./session call keystore_cli import_keystore_json @vault.json @pw2.txt @pw.txt --human"
        code_block: "logosctl call keystore_cli import_keystore_json @vault.json @pw2.txt @pw.txt"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"

  - title: "The keystore's own rules still apply"
    step: true
    text: |
      Being admitted by the gate does not soften the keystore. Each refusal below is the
      keystore speaking — which is the proof that the call reached it.
    steps:
      - title: "An unrelated key needs its acknowledgement"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli create_unrelated_account '{"password":"pw","acknowledgeUnrecoverable":false}' --human || true
          ./logos/bin/logosctl --config-dir ./session call keystore_cli create_unrelated_account '{"password":"pw","acknowledgeUnrecoverable":true}' --human
        code_block: |
          logosctl call keystore_cli create_unrelated_account '{"password":"pw","acknowledgeUnrecoverable":true}'
        expect_contains:
          - "recovery phrase will not restore"
          - '"ok":true'
      - title: "Directory repair"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli settle --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli remove_unexplained '{"path":"nope.json","acknowledgeMayBeKeyMaterial":true}' --human || true
        code_block: |
          logosctl call keystore_cli settle
          logosctl call keystore_cli remove_unexplained '{"path":"nope.json","acknowledgeMayBeKeyMaterial":true}'
        expect_contains:
          - '"swept"'
          - "nope.json"
      - title: "Forget the wallet's key; the wallet's record then refuses to go"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_cli forget_derivation "{\"group\":\"$(cat group.txt)\"}" --human
          ./logos/bin/logosctl --config-dir ./session call keystore_cli derive_next_account "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"password\":\"pw\"}" --human || true
          ./logos/bin/logosctl --config-dir ./session call keystore_cli remove_group "{\"group\":\"$(cat group.txt)\"}" --human || true
        code_block: |
          logosctl call keystore_cli forget_derivation '{"group":"<group>"}'
          logosctl call keystore_cli remove_group '{"group":"<group>"}'
        expect_contains:
          - '"ok":true'
          - '"ok":false'

  - title: "Stop"
    step: true
    steps:
      - title: "Stop the daemon"
        run: "./logos/bin/logosctl --config-dir ./session daemon stop"
        code_block: "logosctl daemon stop"
      - run: "sleep 2"
      - title: "Confirm the daemon has stopped"
        run: "./logos/bin/logosctl --config-dir ./session daemon status || true"
        code_block: "logosctl daemon status"
        expect_contains:
          - "not_running"
