name: "Managing Accounts Headlessly with evm_keystore_cli"
output: evm-keystore-cli-headless.md
release: ""

intro: |
  Every mutation of `keystore_module` — creating, importing, deriving, renaming, exporting
  and deleting accounts — is admitted only to a configured **custodian**. In Basecamp that
  is `evm_keystore_ui`. On a headless `logosctl` daemon there is no such surface, and
  `logosctl call keystore_module import_private_key …` is refused, deliberately: the CLI is
  the host anchor, not a named module.

  `evm_keystore_cli` holds the custodian role for that world. It relays every one of the
  keystore's seventeen gated methods under its own identity — same names, same parameters —
  and turns the keystore's one opaque refusal into a sentence that names the fix. This
  doc-test walks the whole surface against a real daemon, refusals first.

what_you_learn:
  - Why the CLI cannot mutate the keystore on its own, and how a named module can
  - How to name `evm_keystore_cli` a custodian without stripping `evm_keystore_ui`
  - How to pass a JSON document and a password to a relayed method without either being mistyped
  - The full account lifecycle: mnemonic, import, label, HD derivation, export, delete, round-trip
  - Which refusals are the keystore's own rules speaking, and which are the gate

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

sections:
  - title: "Build logosctl and the modules"
    step: true
    text: |
      Four modules take part: `keystore_module`, `signer_manager_module`, the `evm_keystore_cli`
      under test, and `kcli_probe`, a fixture app that asks the manager to open a wallet and to
      unlock it. Each is dropped straight into the session's `modules/` directory, next to the
      bundled `capability_module` that handles the load-time handshake.
    steps:
      - title: "Build the CLI"
        run: 'nix build "github:logos-co/logos-logoscore-cli{release}#ctl" --out-link ./logos'
        code_block: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos"
        check_file: "logos/bin/logosctl"
      - title: "Build keystore_module"
        run: 'nix build "github:logos-co/logos-evm-keystore-module/15c44cc01550ba1b1a92e0a55ef29f17207b818d#install" --out-link ./result-keystore'
        code_block: "nix build 'github:logos-co/logos-evm-keystore-module#install' --out-link ./result-keystore"
        check_file: "result-keystore/modules/keystore_module/manifest.json"
      - title: "Build signer_manager_module"
        run: 'nix build "github:logos-co/logos-signer-manager-module/ab2ccfeb2c193dc39bde28c9be9a9c19fdf35ab7#install" --out-link ./result-manager'
        code_block: "nix build 'github:logos-co/logos-signer-manager-module#install' --out-link ./result-manager"
        check_file: "result-manager/modules/signer_manager_module/manifest.json"
      - title: "Build the app fixture"
        run: 'nix build "github:logos-co/logos-evm-keystore-cli{release}?dir=doctests/requester#install" --out-link ./result-probe'
        code_block: "nix build 'github:logos-co/logos-evm-keystore-cli?dir=doctests/requester#install' --out-link ./result-probe"
        check_file: "result-probe/modules/kcli_probe/manifest.json"
      - title: "Build evm_keystore_cli"
        run: 'nix build "github:logos-co/logos-evm-keystore-cli{release}#install" --out-link ./result-kcli'
        code_block: |
          # From inside the clone this is simply: nix build '.#install'
          nix build 'github:logos-co/logos-evm-keystore-cli#install' --out-link ./result-kcli
        check_file: "result-kcli/modules/evm_keystore_cli/manifest.json"
      - title: "Lay out the session"
        run: |
          mkdir -p session/modules
          cp -RL ./logos/modules/. ./session/modules/
          for r in result-keystore result-manager result-probe result-kcli; do cp -RL ./$r/modules/. ./session/modules/; done
          chmod -R u+w session/modules
          ls session/modules
        code_block: |
          mkdir -p session/modules
          cp -RL ./logos/modules/. ./session/modules/
          cp -RL ./result-*/modules/. ./session/modules/
        expect_contains:
          - "keystore_module"
          - "signer_manager_module"
          - "kcli_probe"
          - "evm_keystore_cli"

  - title: "Start the daemon and load them"
    step: true
    steps:
      - title: "Start the daemon"
        run: "./logos/bin/logosctl --config-dir ./session daemon start --detach"
        code_block: "logosctl daemon start --detach"
      - run: "sleep 3"
      - title: "Load keystore_module"
        run: "./logos/bin/logosctl --config-dir ./session module load keystore_module"
        code_block: "logosctl module load keystore_module"
        expect_contains:
          - "keystore_module"
      - title: "Load evm_keystore_cli, which loads the manager"
        run: "./logos/bin/logosctl --config-dir ./session module load evm_keystore_cli"
        code_block: "logosctl module load evm_keystore_cli"
        expect_contains:
          - "evm_keystore_cli"
      - title: "Load the app fixture"
        run: "./logos/bin/logosctl --config-dir ./session module load kcli_probe"
        code_block: "logosctl module load kcli_probe"
        expect_contains:
          - "kcli_probe"
      - run: "sleep 2"

  - title: "What is refused, and why"
    step: true
    text: |
      Two different refusals. The CLI is refused by the keystore's gate with its deliberately
      opaque `not authorized`. `evm_keystore_cli` is refused by the **same** gate until it is
      named — it holds no special standing, only a name — but it can tell the operator what
      to do about it, because it knows who it is.
    steps:
      - title: "The CLI cannot create a mnemonic"
        run: "./logos/bin/logosctl --config-dir ./session call keystore_module create_mnemonic 12 --human || true"
        code_block: "logosctl call keystore_module create_mnemonic 12"
        expect_contains:
          - "not authorized"
      - title: "Neither can evm_keystore_cli, yet"
        run: "./logos/bin/logosctl --config-dir ./session call evm_keystore_cli create_mnemonic 12 --human || true"
        code_block: "logosctl call evm_keystore_cli create_mnemonic 12"
        expect_contains:
          - "not a configured custodian"
          - "logosctl call keystore_module configure"
          # The hint keeps the manager's role: a total document without it stops all signing.
          - '\"managers\":[\"signer_manager_module\"]'
      - title: "status says the same"
        run: "./logos/bin/logosctl --config-dir ./session call evm_keystore_cli status --human"
        code_block: "logosctl call evm_keystore_cli status"
        expect_contains:
          - '"held":false'

  - title: "Name the custodian"
    step: true
    text: |
      `configure` is **total**: a document that does not name a role leaves it held by
      nobody. So every role is stated: `evm_keystore_ui` stays alongside `evm_keystore_cli`,
      and `signer_manager_module` keeps the right to have the keystore sign.
    steps:
      - title: "Configure every role in one call"
        run: |
          ./logos/bin/logosctl --config-dir ./session call keystore_module configure '{"approvers":["evm_signer_ui"],"custodians":["evm_keystore_ui","evm_keystore_cli"],"managers":["signer_manager_module"]}' --human
        code_block: |
          logosctl call keystore_module configure '{"approvers":["evm_signer_ui"],"custodians":["evm_keystore_ui","evm_keystore_cli"],"managers":["signer_manager_module"]}'
        expect_contains:
          - '"evm_keystore_cli"'
          - '"signer_manager_module"'
      - title: "evm_keystore_cli now holds the role"
        run: "./logos/bin/logosctl --config-dir ./session call evm_keystore_cli status --human"
        code_block: "logosctl call evm_keystore_cli status"
        expect_contains:
          - '"held":true'
          - '"identity":"evm_keystore_cli"'
      - title: "Every gated method is on its surface"
        run: |
          ./logos/bin/logosctl --config-dir ./session module show evm_keystore_cli --json > show.json
          python3 -c '
          import json; names = json.dumps(json.load(open("show.json")))
          want = ["create_mnemonic","import_mnemonic","import_private_key","import_keystore_json","export_keystore_json","change_password","set_label","set_group_label","delete_account","derive_next_account","derive_account_at","preview_addresses","create_unrelated_account","forget_derivation","remove_group","settle","remove_unexplained"]
          missing = [m for m in want if m not in names]
          print("MISSING:", missing) if missing else print("ALL_17_PRESENT")'
        code_block: "logosctl module show evm_keystore_cli"
        expect_contains:
          - "ALL_17_PRESENT"

  - title: "Keys in"
    step: true
    text: |
      Two things about arguments. A JSON document is passed as one quoted string (or
      `@file`), never with `json:` — the keystore takes it as text and parses it itself. A
      password is passed with `@file` so it stays out of shell history and `ps`; the file
      may end in a newline, `evm_keystore_cli` strips exactly one.
    steps:
      - title: "Generate a mnemonic"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli create_mnemonic 12 --human \
            | python3 -c 'import sys,json; p=json.load(sys.stdin)["phrase"]; open("phrase.txt","w").write(p); print(len(p.split()), "words")'
        code_block: "logosctl call evm_keystore_cli create_mnemonic 12"
        expect_contains:
          - "12 words"
      - title: "Import a private key"
        text: |
          Foundry's well-known account 0, a published test key. The password file is written
          with `echo`, newline and all.
        run: |
          echo pw > pw.txt
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 @pw.txt --human
        code_block: "logosctl call evm_keystore_cli import_private_key <privkey> @pw.txt"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      - title: "Name it"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli set_label f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 str:Treasury @pw.txt --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli get_labels --human
        code_block: |
          logosctl call evm_keystore_cli set_label f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 str:Treasury @pw.txt
          logosctl call evm_keystore_cli get_labels
        expect_contains:
          - "Treasury"
      - title: "Import the mnemonic as a derivable wallet"
        text: |
          `storage: "extkey"` keeps the wallet's account key under its own password, so
          later accounts can be derived without the phrase.
        run: |
          python3 -c 'import json; json.dump({"phrase": open("phrase.txt").read(), "password": "pw", "storage": "extkey", "groupPassword": "gp", "groupLabel": "Cold storage"}, open("import.json","w"))'
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli import_mnemonic @import.json --human \
            | python3 -c 'import sys,json; v=json.load(sys.stdin); print(v); open("group.txt","w").write(v["group"]); open("a0.txt","w").write(v["address"])'
        code_block: "logosctl call evm_keystore_cli import_mnemonic @import.json"
        expect_contains:
          - "'origin'"
          - "'group'"
      - title: "Derive the next account"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli derive_next_account "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"password\":\"pw\"}" --human
        code_block: |
          logosctl call evm_keystore_cli derive_next_account '{"group":"<group>","groupPassword":"gp","password":"pw"}'
        expect_contains:
          - '"index":1'
      - title: "Preview, then derive at a chosen index"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli preview_addresses "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"count\":3}" --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli derive_account_at "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"password\":\"pw\",\"index\":5}" --human
        code_block: |
          logosctl call evm_keystore_cli preview_addresses '{"group":"<group>","groupPassword":"gp","count":3}'
          logosctl call evm_keystore_cli derive_account_at '{"group":"<group>","groupPassword":"gp","password":"pw","index":5}'
        expect_contains:
          - '"addresses":['
          - '"index":5'
      - title: "Name the wallet"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli set_group_label "{\"group\":\"$(cat group.txt)\",\"label\":\"Vault\",\"address\":\"$(cat a0.txt)\",\"password\":\"pw\"}" --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli get_group_labels --human
        code_block: |
          logosctl call evm_keystore_cli set_group_label '{"group":"<group>","label":"Vault","address":"<address>","password":"pw"}'
          logosctl call evm_keystore_cli get_group_labels
        expect_contains:
          - "Vault"
      - title: "The reads, ungated as ever"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli list_accounts --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli list_groups --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli list_derivation_keys --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli get_provenance --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli caller_identity --human
        code_block: |
          logosctl call evm_keystore_cli list_accounts
          logosctl call evm_keystore_cli caller_identity
        expect_contains:
          - '"accounts":['
          - '"identity":"evm_keystore_cli"'

  - title: "Keys out, and back"
    step: true
    steps:
      - title: "Change the password, export the vault, delete the account"
        run: |
          echo pw2 > pw2.txt
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli change_password f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw.txt @pw2.txt --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli export_keystore_json f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw2.txt --human \
            | python3 -c 'import sys,json; open("vault.json","w").write(json.load(sys.stdin)["keystore"]); print("exported")'
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli delete_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw2.txt --human
        code_block: |
          logosctl call evm_keystore_cli change_password <address> @pw.txt @pw2.txt
          logosctl call evm_keystore_cli export_keystore_json <address> @pw2.txt
          logosctl call evm_keystore_cli delete_account <address> @pw2.txt
        expect_contains:
          - "exported"
          - '{"ok":true}'
      - title: "A wrong password on delete says so"
        text: |
          The keystore answers a bare `false` here, by construction indistinguishable from a
          refusal. `evm_keystore_cli` checks its own standing and says which it was.
        run: "./logos/bin/logosctl --config-dir ./session call evm_keystore_cli delete_account f39Fd6e51aad88F6F4ce6aB8827279cffFb92266 @pw.txt --human || true"
        code_block: "logosctl call evm_keystore_cli delete_account <address> @pw.txt"
        expect_contains:
          - "wrong password, or no such account"
      - title: "Import the exported vault under a new password"
        run: "./logos/bin/logosctl --config-dir ./session call evm_keystore_cli import_keystore_json @vault.json @pw2.txt @pw.txt --human"
        code_block: "logosctl call evm_keystore_cli import_keystore_json @vault.json @pw2.txt @pw.txt"
        expect_contains:
          - "f39Fd6e51aad88F6F4ce6aB8827279cffFb92266"

  - title: "The keystore's own rules still apply"
    step: true
    text: |
      Being admitted by the gate does not soften the keystore. Each refusal below is the
      keystore speaking — which is the proof that the call reached it.
    steps:
      - title: "An unrelated key needs its acknowledgement"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli create_unrelated_account '{"password":"pw","acknowledgeUnrecoverable":false}' --human || true
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli create_unrelated_account '{"password":"pw","acknowledgeUnrecoverable":true}' --human
        code_block: |
          logosctl call evm_keystore_cli create_unrelated_account '{"password":"pw","acknowledgeUnrecoverable":true}'
        expect_contains:
          - "recovery phrase will not restore"
          - '"ok":true'
      - title: "Directory repair"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli settle --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli remove_unexplained '{"path":"nope.json","acknowledgeMayBeKeyMaterial":true}' --human || true
        code_block: |
          logosctl call evm_keystore_cli settle
          logosctl call evm_keystore_cli remove_unexplained '{"path":"nope.json","acknowledgeMayBeKeyMaterial":true}'
        expect_contains:
          - '"swept"'
          - "nope.json"
      - title: "Forget the wallet's key; the wallet's record then refuses to go"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli forget_derivation "{\"group\":\"$(cat group.txt)\"}" --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli derive_next_account "{\"group\":\"$(cat group.txt)\",\"groupPassword\":\"gp\",\"password\":\"pw\"}" --human || true
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli remove_group "{\"group\":\"$(cat group.txt)\"}" --human || true
        code_block: |
          logosctl call evm_keystore_cli forget_derivation '{"group":"<group>"}'
          logosctl call evm_keystore_cli remove_group '{"group":"<group>"}'
        expect_contains:
          - '"ok":true'
          - '"ok":false'

  - title: "Bitcoin wallets, and keeping the phrase"
    step: true
    text: |
      A Bitcoin wallet comes from a phrase like an EVM one. Keeping the phrase is the person's
      choice, off unless asked: it goes into a vault of its own, under a password of its own,
      and the wallet names it. The password documents travel as `@file`, so they stay out of
      `ps` and shell history.
    steps:
      - title: "Import a regtest wallet, keeping its phrase"
        run: |
          printf '%s' '{"phrase":"test test test test test test test test test test test junk","family":"bitcoin","chain":"test","password":"btc-pw","label":"Regtest wallet","keepPhrase":{"password":"phrase-pw"}}' > btc.json
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli import_bitcoin @btc.json --human | tee btc-reply.json
          python3 -c 'import json; r=json.load(open("btc-reply.json")); open("btc-group.txt","w").write(r["group"]); open("phrase-id.txt","w").write(r["phrase"])'
        code_block: "logosctl call evm_keystore_cli import_bitcoin @btc.json      # {phrase, family, chain, password, label, keepPhrase: {password}}"
        expect_contains:
          - '"external":"wpkh([16a93ed0/84''/1''/0'']tpub'
          - '"phrase":"p_'
      - title: "The kept phrase, and the wallet that names it"
        run: "./logos/bin/logosctl --config-dir ./session call evm_keystore_cli list_phrases --human"
        code_block: "logosctl call evm_keystore_cli list_phrases"
        expect_contains:
          - '"groups":["g_'
          - '"staged":false'
      - title: "Its words, with its own password only"
        run: |
          printf '{"phrase":"%s","password":"btc-pw"}' "$(cat phrase-id.txt)" > wrong.json
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli show_phrase @wrong.json --human || true
          printf '{"phrase":"%s","password":"phrase-pw"}' "$(cat phrase-id.txt)" > show.json
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli show_phrase @show.json --human
        code_block: "logosctl call evm_keystore_cli show_phrase @show.json      # {phrase, password}"
        expect_contains:
          - "the password for this phrase is not correct"
          - '"words":"test test test test test test test test test test test junk"'
      - title: "An EVM wallet from the kept phrase, without the words"
        run: |
          printf '{"keptPhrase":"%s","phrasePassword":"phrase-pw","password":"evm-pw","accountIndex":5}' "$(cat phrase-id.txt)" > evm.json
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli import_mnemonic @evm.json --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli list_phrases --human
        code_block: |
          logosctl call evm_keystore_cli import_mnemonic @evm.json      # {keptPhrase, phrasePassword, password, accountIndex}
          logosctl call evm_keystore_cli list_phrases                   # the phrase, now named by two wallets
        expect_contains:
          - '"address":"0x9965507D1a55bcC2695C58ba16FB37d819B0A4dc"'
          - '"origin":"derived"'

  - title: "An app asks to open the wallet, then to unlock it"
    step: true
    text: |
      Apps never get a wallet's keys: they ask the signer manager, and the person decides.
      `evm_keystore_cli` decides headlessly once it is the manager's custodian too — `status`
      names the command, and `configure` is total, so it keeps the Basecamp keys app and the
      signers.
    steps:
      - title: "Not the manager's custodian yet"
        run: "./logos/bin/logosctl --config-dir ./session call evm_keystore_cli status --human"
        code_block: "logosctl call evm_keystore_cli status"
        expect_contains:
          - '"manager_held":false'
          - "logosctl call signer_manager_module configure"
      - title: "Name it the manager's custodian"
        run: |
          ./logos/bin/logosctl --config-dir ./session call signer_manager_module configure '{"approvers":["evm_signer_ui"],"custodians":["evm_keystore_ui","evm_keystore_cli"],"signers":["keystore_module"]}' --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli status --human
        code_block: |
          logosctl call signer_manager_module configure '{"approvers":["evm_signer_ui"],"custodians":["evm_keystore_ui","evm_keystore_cli"],"signers":["keystore_module"]}'
        expect_contains:
          - '"manager_held":true'
      - title: "The app asks to open any native segwit wallet on regtest"
        run: |
          ./logos/bin/logosctl --config-dir ./session call kcli_probe request_open regtest --human \
            | python3 -c 'import sys,json; open("open-handle.txt","w").write(json.load(sys.stdin)["handle"])'
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli access_requests --human
        code_block: |
          logosctl call kcli_probe request_open regtest
          logosctl call evm_keystore_cli access_requests
        expect_contains:
          - '"requester":"kcli_probe"'
          - '"kind":"open"'
      - title: "What the manager shows, and what was asked"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli show_access "$(cat open-handle.txt)" --human | tee shown.json
        code_block: "logosctl call evm_keystore_cli show_access <handle>"
        expect_contains:
          - "kcli_probe asks to open a Bitcoin wallet"
          - "Any native segwit wallet on regtest: pick one, create one or restore one"
          - '"network":"regtest"'
      - title: "Open the regtest wallet for it"
        text: |
          The decision names the wallet picked, and carries the wallet's password as a file.
        run: |
          python3 -c '
          import json
          shown = json.load(open("shown.json"))
          json.dump({"handle": shown["handle"], "bundle_id": shown["bundle_id"],
                     "group": open("btc-group.txt").read(), "password": "btc-pw"}, open("decision.json", "w"))'
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli approve_access @decision.json --human
          ./logos/bin/logosctl --config-dir ./session call kcli_probe outcome "$(cat open-handle.txt)" --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli open_accounts --human
        code_block: |
          logosctl call evm_keystore_cli approve_access @decision.json      # {handle, bundle_id, group, password}
          logosctl call kcli_probe outcome <handle>
          logosctl call evm_keystore_cli open_accounts
        expect_contains:
          - '"reason":"approved"'
          - '"databaseKey":"'
          - '"network":"regtest"'
          - '"module":"kcli_probe"'
      - title: "The app asks for two confirmed signatures; the person grants them"
        run: |
          ./logos/bin/logosctl --config-dir ./session call kcli_probe request_unlock "$(cat btc-group.txt)" 2 --human \
            | python3 -c 'import sys,json; open("unlock-handle.txt","w").write(json.load(sys.stdin)["handle"])'
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli show_access "$(cat unlock-handle.txt)" --human > shown2.json
          python3 -c '
          import json
          shown = json.load(open("shown2.json"))
          json.dump({"handle": shown["handle"], "bundle_id": shown["bundle_id"], "password": "btc-pw",
                     "unlock": shown["asked"]["terms"]}, open("decision2.json", "w"))'
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli approve_access @decision2.json --human
          ./logos/bin/logosctl --config-dir ./session call kcli_probe outcome "$(cat unlock-handle.txt)" --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli unlocked --human
        code_block: |
          logosctl call kcli_probe request_unlock <group> 2
          logosctl call evm_keystore_cli show_access <handle>
          logosctl call evm_keystore_cli approve_access @decision2.json     # {handle, bundle_id, password, unlock: {…}}
          logosctl call evm_keystore_cli unlocked
        expect_contains:
          - '"count":2'
          - '"countLeft":2'
          - '"apps":["kcli_probe"]'
      - title: "Lock everything, close the wallet, forget the phrase"
        run: |
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli lock '{}' --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli unlocked --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli close_account "{\"group\":\"$(cat btc-group.txt)\",\"module\":\"kcli_probe\"}" --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli forget_phrase "{\"phrase\":\"$(cat phrase-id.txt)\"}" --human
          ./logos/bin/logosctl --config-dir ./session call evm_keystore_cli list_phrases --human
        code_block: |
          logosctl call evm_keystore_cli lock '{}'
          logosctl call evm_keystore_cli close_account '{"group":"<group>","module":"kcli_probe"}'
          logosctl call evm_keystore_cli forget_phrase '{"phrase":"<id>"}'
        expect_contains:
          - '"locked":1'
          - '"unlocked":[]'
          - '"closed":true'
          - '"forgotten":true'
          - '"phrases":[]'

  - title: "Stop"
    step: true
    steps:
      - title: "Stop the daemon"
        run: "./logos/bin/logosctl --config-dir ./session daemon stop"
        code_block: "logosctl daemon stop"
      - run: "sleep 2"
      - title: "Confirm the daemon has stopped"
        run: "./logos/bin/logosctl --config-dir ./session daemon status || true"
        code_block: "logosctl daemon status"
        expect_contains:
          - "not_running"
